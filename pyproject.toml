[project]
name = "sovos-bridge"
version = "1.0.0"
description = "Integración TXT del sistema de facturación a Sovos Compliance Network (Perú)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "lxml>=5",
    "pydantic>=2.6,<3",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sovos-bridge = "sovos_bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sovos_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
